# ============================================================
#  Pages CMS configuration
#  Location: repository root (same folder as index.html)
# ============================================================

# Where uploaded images go.
# The existing work images live in works/, so new uploads join them
# and the saved paths keep the same shape: works/filename.jpg
media:
    input: works
    output: works
    extensions: [jpg, jpeg, png, webp]

# The editing menu the client sees.
content:
    - name: biography
      label: Biography
      type: file
      path: bio.json
      format: json
      fields:
          - name: text
            label: Biography
            type: text
            required: true
            description: "Leave a blank line between paragraphs. For italics, wrap the text in <i> and </i> — for example: <i>De Witte Raaf</i>"

    # data.json is a top-level array, so list: true is set on the entry
    # and the fields below describe a single item.
    - name: works
      label: Works
      type: file
      path: data.json
      format: json
      list: true
      fields:
          - name: date
            label: Year
            type: string
            required: true
            description: Four digits only, e.g. 2026. The list is sorted by year, newest first.

          - name: category
            label: Category
            type: select
            required: true
            description: Decides which filter this entry appears under.
            options:
                values:
                    - name: exhibitions
                      label: Exhibitions
                    - name: edited
                      label: Edited
                    - name: criticism
                      label: Criticism
                    - name: writings
                      label: Writings
                    - name: commissioned
                      label: Commissioned

          - name: col2
            label: Entry
            type: text
            required: true
            description: "The citation line. For italics, wrap the text in <i> and </i> — for example: <i>Simulacrum Magazine</i>"

          - name: description
            label: Description
            type: text

          - name: link
            label: Links
            type: string
            list: true
            description: Full address starting with https:// — add as many as you need.

          - name: image
            label: Images
            type: image
            list: true
            description: JPG, 1600px wide or less. Add several images to create a carousel you can click through.
